name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APKs
        run: ./gradlew assembleOsmDebug assembleGoogleDebug
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: tracker-osm-apk
          path: app/build/outputs/apk/osm/debug/app-osm-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tracker-google-apk
          path: app/build/outputs/apk/google/debug/app-google-debug.apk
