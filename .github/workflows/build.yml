name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APKs and run unit tests
        run: ./gradlew assembleDebug :zugreise:testDebugUnitTest
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
      - name: Live-Test Fahrplandienst (Zugreise)
        continue-on-error: true
        run: ./gradlew :zugreise:testDebugUnitTest --tests '*LiveApiTest*' --rerun
        env:
          LIVE_API: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: standort-tracker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: zugreise-apk
          path: zugreise/build/outputs/apk/debug/zugreise-debug.apk
