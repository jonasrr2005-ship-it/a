name: Sprachassistent - APK bauen

on:
  push:
    paths:
      - sprachassistent/**
      - .github/workflows/sprachassistent-build.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sprachassistent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: APK bauen
        run: ./gradlew assembleDebug
      - name: Pruefen auf Android-4.0-Kompatibilitaet (Lint)
        run: |
          ./gradlew lintDebug
          cat app/build/reports/lint-results-debug.txt || true
      - name: APK-Inhalt anzeigen
        run: |
          ls -la app/build/outputs/apk/debug/
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "\.so|classes|assets/ps|roots"
          $(ls -d $ANDROID_HOME/build-tools/* | tail -1)/aapt dump badging app/build/outputs/apk/debug/app-debug.apk | grep -E "sdkVersion|native-code|package" || true
      - uses: actions/upload-artifact@v4
        with:
          name: sprachassistent-apk
          path: sprachassistent/app/build/outputs/apk/debug/app-debug.apk
