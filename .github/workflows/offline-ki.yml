name: Offline KI APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Offline-KI debug APK
        run: ./gradlew :offlineki:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: offline-ki-apk
          path: offlineki/build/outputs/apk/debug/offlineki-debug.apk
